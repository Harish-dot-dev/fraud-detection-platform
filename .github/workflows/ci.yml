name: CI

# The point of the synthetic fixture is that CI needs no Kaggle account, no
# Docker services and no GPU. Keep it that way: if a test needs Kafka, Redis,
# Spark or Ollama, mark it (needs_spark / needs_ollama / slow) instead of
# adding a service here.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned to the same version as the dev dependency group so that a
        # local `make lint` and CI can never disagree.
        run: pip install ruff==0.7.2

      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev,dbt]"

      - name: Run the fast test suite
        run: pytest -m "not slow and not needs_spark and not needs_ollama" --cov=. --cov-report=term-missing

      - name: Check the committed fixture is up to date
        # Regenerating with the documented arguments must produce no diff.
        run: |
          python scripts/make_synthetic_sample.py --rows 1000 --out tests/fixtures
          git diff --exit-code tests/fixtures

  spark-tests:
    name: Spark tests (Java 17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Spark 3.5 supports Java 8/11/17 - not 21, which is the runner default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Delta's jars are resolved through Ivy on first use; caching them keeps
      # this job at a couple of minutes.
      - name: Cache Ivy jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev,spark,quality]"

      - name: Run the Spark tests
        run: pytest -m "needs_spark"

  pgvector-tests:
    name: Case store (pgvector)
    runs-on: ubuntu-24.04
    services:
      pgvector:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: fraud_cases
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud_local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud_cases"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The case store needs a Postgres driver, not the whole GenAI extra -
        # sentence-transformers would pull torch, which is 2 GB of download for
        # tests that use the deterministic stub embedder anyway.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]" "psycopg[binary]==3.2.3" "pgvector==0.3.6"

      - name: Run the case store tests
        env:
          PGVECTOR_HOST: localhost
        run: pytest -m "needs_pgvector"

  compose:
    name: docker compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Compose file and its profiles
        run: |
          cp .env.example .env
          docker compose --profile core --profile ai config --quiet
          echo "Compose file is valid."
